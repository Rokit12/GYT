name: ci
on: [push, pull_request]

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv

  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: gyt, POSTGRES_PASSWORD: gyt, POSTGRES_DB: gyt_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gyt" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: api } }
    env:
      TEST_DATABASE_URL: postgresql+psycopg://gyt:gyt@localhost:5432/gyt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm test
      - run: npm run build
